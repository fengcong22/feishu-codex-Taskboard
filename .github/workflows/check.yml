name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            taskboard/package-lock.json
      - name: Install Bridge dependencies
        run: npm ci
      - name: Install Taskboard dependencies
        run: npm ci --prefix taskboard
      - name: Run complete verification gate
        run: npm run test:ci
