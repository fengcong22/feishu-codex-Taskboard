name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            taskboard/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media test dependencies
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            choco install ffmpeg --yes --no-progress
            $installExitCode = $LASTEXITCODE
            $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
            $ffprobe = Get-Command ffprobe -ErrorAction SilentlyContinue
            if ($installExitCode -eq 0 -and $ffmpeg -and $ffprobe) { break }
            if ($attempt -eq $maxAttempts) {
              throw "FFmpeg install failed after $maxAttempts attempts (exit code: $installExitCode)."
            }
            Write-Host "FFmpeg tools unavailable after attempt $attempt/$maxAttempts; retrying."
            Start-Sleep -Seconds (5 * $attempt)
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version
      - name: Install Bridge dependencies
        run: npm ci
      - name: Install Taskboard dependencies
        run: npm ci --prefix taskboard
      - name: Run complete verification gate
        run: npm run test:ci
